<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josa's Whiteboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Your personal Google Apps Script Web App URL
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgs37feS6Rwh8pb2F3YOY02gwKWzaeFVcrKm9wUJMqmWBEksFB0aMFpXkpE2abmnmF/exec";

        function Whiteboard() {
            const [todos, setTodos] = useState([]);
            const [newTodo, setNewTodo] = useState("");
            const [isSyncing, setIsSyncing] = useState(false);
            const [syncError, setSyncError] = useState(null);

            // Fetch live tasks from Google Sheet on page load
            const fetchTodos = async () => {
                if (!APPS_SCRIPT_URL) return;
                setIsSyncing(true);
                setSyncError(null);
                try {
                    const res = await fetch(APPS_SCRIPT_URL);
                    const data = await res.json();
                    setTodos(data);
                } catch (err) {
                    console.error("Failed to fetch tasks:", err);
                    setSyncError("Sync failed. Check connection.");
                } finally {
                    setIsSyncing(false);
                }
            };

            // Save updated tasks back to Google Sheet
            const saveTodosToSheet = async (updatedTodos) => {
                if (!APPS_SCRIPT_URL) return;
                setIsSyncing(true);
                setSyncError(null);
                try {
                    await fetch(APPS_SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ todos: updatedTodos })
                    });
                } catch (err) {
                    console.error("Failed to save tasks:", err);
                    setSyncError("Save failed.");
                } finally {
                    setIsSyncing(false);
                }
            };

            useEffect(() => {
                fetchTodos();
            }, []);

            const addTodo = (e) => {
                e.preventDefault();
                if (!newTodo.trim()) return;
                const updated = [...todos, { id: Date.now(), text: newTodo, done: false }];
                setTodos(updated);
                setNewTodo("");
                saveTodosToSheet(updated);
            };

            const toggleTodo = (id) => {
                const updated = todos.map(t => t.id === id ? { ...t, done: !t.done } : t);
                setTodos(updated);
                saveTodosToSheet(updated);
            };

            const deleteTodo = (id) => {
                const updated = todos.filter(t => t.id !== id);
                setTodos(updated);
                saveTodosToSheet(updated);
            };

            return (
                <div className="max-w-7xl mx-auto space-y-6">
                    {/* Header */}
                    <header className="bg-white p-6 rounded-xl shadow-sm flex justify-between items-center border border-gray-200">
                        <div>
                            <h1 className="text-2xl font-bold text-gray-800">Josa's Interactive Whiteboard</h1>
                            <p className="text-sm text-gray-500">M&E Team & Personal Calendar Integration</p>
                        </div>
                        <div className="flex items-center gap-3">
                            {isSyncing && <span className="text-xs text-purple-600 animate-pulse font-medium">☁️ Syncing...</span>}
                            {syncError && <span className="text-xs text-red-500 font-medium">{syncError}</span>}
                            <button 
                                onClick={fetchTodos} 
                                className="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold rounded-md border"
                            >
                                🔄 Refresh Tasks
                            </button>
                        </div>
                    </header>

                    {/* Main Board Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        
                        {/* M&E Team Calendar Embed */}
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-t-4 border-t-blue-500 flex flex-col h-[650px]">
                            <h2 className="font-bold text-gray-800 mb-3 flex items-center gap-2">
                                🏢 M&E Team Calendar
                            </h2>
                            <div className="flex-1 rounded-lg overflow-hidden border border-gray-200 bg-gray-50">
                                <iframe 
                                    src="https://calendar.google.com/calendar/embed?src=meunit%40tapi.dost.gov.ph&ctz=Asia%2FManila&mode=AGENDA" 
                                    style={{ border: 0, width: "100%", height: "100%" }} 
                                    frameBorder="0" 
                                    scrolling="no">
                                </iframe>
                            </div>
                        </div>

                        {/* Josa's Personal Work Calendar Embed */}
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-t-4 border-t-emerald-500 flex flex-col h-[650px]">
                            <h2 className="font-bold text-gray-800 mb-3 flex items-center gap-2">
                                👤 Josa's Work Calendar
                            </h2>
                            <div className="flex-1 rounded-lg overflow-hidden border border-gray-200 bg-gray-50">
                                <iframe 
                                    src="https://calendar.google.com/calendar/embed?src=josa.elegado%40tapi.dost.gov.ph&ctz=Asia%2FManila&mode=AGENDA" 
                                    style={{ border: 0, width: "100%", height: "100%" }} 
                                    frameBorder="0" 
                                    scrolling="no">
                                </iframe>
                            </div>
                        </div>

                        {/* Interactive To-Do List */}
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-t-4 border-t-purple-500 flex flex-col h-[650px]">
                            <h2 className="font-bold text-gray-800 mb-3 flex items-center gap-2">
                                ⚡ Action Items
                            </h2>
                            
                            <form onSubmit={addTodo} className="flex gap-2 mb-4">
                                <input 
                                    type="text" 
                                    value={newTodo}
                                    onChange={(e) => setNewTodo(e.target.value)}
                                    placeholder="Add task..."
                                    className="p-2 text-xs border rounded flex-1 focus:outline-none focus:ring-2 focus:ring-purple-400"
                                />
                                <button type="submit" className="bg-purple-600 text-white text-xs px-3 py-2 rounded hover:bg-purple-700 font-medium">
                                    Add
                                </button>
                            </form>

                            <div className="flex-1 overflow-y-auto space-y-2 pr-1">
                                {todos.map(todo => (
                                    <div 
                                        key={todo.id} 
                                        className="flex items-center justify-between text-xs p-2.5 bg-gray-50 hover:bg-gray-100 rounded border border-gray-100 group"
                                    >
                                        <div 
                                            onClick={() => toggleTodo(todo.id)}
                                            className="flex items-center gap-2 cursor-pointer flex-1"
                                        >
                                            <input 
                                                type="checkbox" 
                                                checked={todo.done} 
                                                readOnly 
                                                className="rounded text-purple-600" 
                                            />
                                            <span className={todo.done ? "line-through text-gray-400" : "text-gray-700 font-medium"}>
                                                {todo.text}
                                            </span>
                                        </div>
                                        <button 
                                            onClick={() => deleteTodo(todo.id)}
                                            className="text-gray-300 hover:text-red-500 font-bold px-1"
                                        >
                                            ✕
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Whiteboard />);
    </script>
</body>
</html>
